version: '3.8'

# Development docker-compose - only runs PostgreSQL
# Use `npm run dev` for the Next.js app

services:
  postgres:
    image: postgres:16-alpine
    container_name: graphflow-db-dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: graphflow
      POSTGRES_PASSWORD: graphflow
      POSTGRES_DB: graphflow
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U graphflow"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data_dev:
